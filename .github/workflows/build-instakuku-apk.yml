name: Build InstaKuku APK

on:
  push:
    branches:
      - instakuku-apk-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack Android project
        run: |
          cat instakuku_chunks/chunk_* > instakuku-project.tar.gz.b64
          base64 -d instakuku-project.tar.gz.b64 > instakuku-project.tar.gz
          tar -xzf instakuku-project.tar.gz
      - name: Build debug APK
        working-directory: InstaKuku-Android
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaKuku-APK
          path: InstaKuku-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
